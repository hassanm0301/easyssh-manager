name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: easyssh-manager-vsix
          path: artifacts/easyssh-manager.vsix
          if-no-files-found: error
  extension-host:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:extension
  openssh-fixture:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t easyssh-manager-fixture test/fixtures/openssh
      - run: docker run --rm -d --name easyssh-manager-fixture -p 2222:2222 easyssh-manager-fixture
      - run: docker exec easyssh-manager-fixture /usr/sbin/sshd -T
