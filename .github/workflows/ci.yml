name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package

  extension-and-integration:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build --tag easyssh-manager-openssh-fixture test/fixtures/openssh
      - run: xvfb-run -a npm run test:extension
      - run: npm run test:integration
